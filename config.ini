; ============================================================
;  config.ini  —  настройки «Сменить раскладку»
;  Изменяйте значения, программа подхватит их при запуске.
;  Путь: рядом с layout-switcher.ahk (после установки —
;  в %LOCALAPPDATA%\LayoutSwitcher\config.ini)
; ============================================================

[Hotkeys]
; Термин клавиш AHK: ^ — Ctrl, + — Shift, ! — Alt.
; Основной хоткей: конвертировать и вставить.
Hotkey=^+X
; Второй хоткей: только скопировать в буфер, без вставки.
HotkeyCopyOnly=^!+X

[Main]
; auto — автоопределение направления (кириллица->латиница и обратно)
Direction=auto
; 1 — после конвертации заменить выделение вставкой сразу
AutoPaste=1
; 1 — звуковой сигнал при срабатывании
Sound=0
; 1 — вернуть прежнее содержимое буфера обмена после срабатывания
RestoreClipboard=0
; время показа всплывающей подсказки, мс
TooltipMs=2500
; клавиша "копировать" для чтения выделения (не менять без причины)
CopyKey=^c
; 1 — вместе с исправленным текстом менять и язык ввода (RU<->EN)
SwitchLayout=1
